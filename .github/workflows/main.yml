name: Tests
on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Install Playwright Chromium
      run: pnpm exec playwright install --with-deps chromium
    # the build users get has no test hook (#81); the end-to-end tests build their own
    - name: Production build without test hook
      run: pnpm run check:production-build
    # unit tests, then the end-to-end tests against their own relay and build
    - name: Test
      run: pnpm test
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: |
          playwright-report
          test-results/relay.log
        retention-days: 7

  # Pages only gets a build whose tests passed, and only from main
  build-pages:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # the history and the tags: the version counts the commits since the tag of
        # package.json's version, one more with every deploy (scripts/app-version.js)
        fetch-depth: 0
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Build for GitHub Pages
      # Pages serves the app below /deContact; SvelteKit takes care of every path.
      # The app finds its relays on Aleph, so the build needs no relay addresses.
      env:
        BASE_PATH: /deContact
      run: |
        pnpm install --frozen-lockfile
        pnpm run build
    # the very directory Pages publishes has no test hook (#81)
    - name: No test hook in the build
      run: node scripts/check-production-build.mjs build
    - uses: actions/upload-pages-artifact@v5
      with:
        path: ./build

  # Deploys in a job of its own, as GitHub's Pages starter workflows do. Right after an
  # upload, the run's artifact list can still lack it for seconds (actions/deploy-pages#451):
  # deploy-pages then fails with 'No artifacts named "github-pages" were found'. A separate
  # job starts later, tries once more after a pause, and "Re-run failed jobs" deploys the
  # same artifact again instead of uploading a second one.
  deploy:
    needs: build-pages
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5
      continue-on-error: true
    - name: Wait before deploying again
      if: steps.deployment.outcome == 'failure'
      run: sleep 60
    - id: deployment-retry
      if: steps.deployment.outcome == 'failure'
      uses: actions/deploy-pages@v5
