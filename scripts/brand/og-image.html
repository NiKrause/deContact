<!doctype html>
<html lang="<!-- lang -->">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    background: #161616;
    font-family: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: #f4f4f4;
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 0 88px;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }
  .icon { width: 340px; height: 340px; flex-shrink: 0; border-radius: 76px; overflow: hidden; }
  .icon svg { width: 100%; height: 100%; display: block; }
  h1 { font-size: 96px; font-weight: 600; letter-spacing: -2px; margin: 0 0 20px; line-height: 1; }
  .lead { font-size: 40px; line-height: 1.25; margin: 0 0 24px; color: #f4f4f4; }
  .more { font-size: 30px; line-height: 1.35; margin: 0; color: #a8a8a8; }
  .bar { position: absolute; left: 0; bottom: 0; width: 100%; height: 12px; background: #0f62fe; }
</style>
</head>
<body>
  <div class="icon"><!-- icon --></div>
  <div>
    <h1>deContact</h1>
    <p class="lead"><!-- lead --></p>
    <p class="more"><!-- more --></p>
  </div>
  <div class="bar"></div>
</body>
</html>
