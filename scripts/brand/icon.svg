<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>deContact</title>
  <!-- the source of every icon (scripts/render-brand-images.mjs). Full bleed: a maskable
       icon keeps what lies within the inner 80 %, and the cards do. -->
  <rect id="background" width="512" height="512" fill="#161616"/>
  <!-- two contact cards, exchanged -->
  <g id="cards">
    <g transform="rotate(-8 256 256)">
      <rect x="96" y="150" width="250" height="168" rx="22" fill="#393939"/>
      <circle cx="160" cy="214" r="30" fill="#6f6f6f"/>
      <rect x="206" y="196" width="100" height="14" rx="7" fill="#6f6f6f"/>
      <rect x="206" y="222" width="72" height="14" rx="7" fill="#6f6f6f"/>
    </g>
    <g transform="rotate(6 256 256)">
      <rect x="166" y="196" width="250" height="168" rx="22" fill="#ffffff"/>
      <circle cx="230" cy="260" r="32" fill="#0f62fe"/>
      <rect x="278" y="240" width="104" height="16" rx="8" fill="#c6c6c6"/>
      <rect x="278" y="268" width="76" height="16" rx="8" fill="#c6c6c6"/>
      <rect x="198" y="318" width="186" height="12" rx="6" fill="#e0e0e0"/>
    </g>
  </g>
</svg>
